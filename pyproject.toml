[project]
name = "mlops-agent"
version = "1.0.0"
description = "Conversational MLOps agent for DVC, MLflow, Apache Airflow and Kubernetes"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40,<3",
    "mlflow==3.18.0",
    "dvc==3.67.1",
    "kubernetes==37.0.1",
    "requests>=2.31,<3",
    "scikit-learn==1.9.1",
    "pandas>=2.2,<4",
    "joblib==1.6.0",
    "skops==0.16.0",
    "fastapi==0.162.4",
    "uvicorn[standard]==0.54.0",
    "pydantic>=2.7,<3",
    "PyYAML>=6.0,<7",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.5,<1"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["reproductions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = [
    "S101",  # assert in tests
    "S603",  # subprocess with fixed argument lists, never a shell
    "S607",  # git/dvc/kubectl resolved from PATH on purpose
    "S104",  # the API binds 0.0.0.0 inside its container
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S108", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
