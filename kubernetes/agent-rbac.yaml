# Least-privilege identity for running the agent against a shared cluster.
# Read access to the application namespace, plus only the two write operations the agent
# exposes (rolling restart = patch deployment, scale = patch deployments/scale).
# On a local Docker Desktop cluster the agent can simply use your kubeconfig instead.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mlops-agent
  namespace: mlops-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mlops-agent
  namespace: mlops-demo
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "endpoints", "events", "configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mlops-agent
  namespace: mlops-demo
subjects:
  - kind: ServiceAccount
    name: mlops-agent
    namespace: mlops-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mlops-agent
